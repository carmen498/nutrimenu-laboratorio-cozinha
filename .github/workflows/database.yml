name: Supabase Database

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Supabase CLI
        env:
          SUPABASE_CLI_VERSION: 2.116.0
          SUPABASE_CLI_SHA256: 5b3031cb297d51b25be4c284e4c852254460ec722ec221d3b81b07d55acfd158
        run: |
          archive="$RUNNER_TEMP/supabase.tar.gz"
          bin_dir="$RUNNER_TEMP/supabase-bin"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${SUPABASE_CLI_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$bin_dir"
          tar --extract --gzip --file "$archive" --directory "$bin_dir" supabase
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Verify pinned CLI
        run: test "$(supabase --version)" = "2.116.0"

      - name: Verify database-only configuration
        run: python3 supabase/tests/verify_config.py

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local

      - name: Lint database
        run: supabase db lint --level error

      - name: Run database tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
